<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/sec1.css">
    <link rel="stylesheet" href="./styles/sec2.css">
    <link rel="stylesheet" href="./styles/sec3.css">
    <link rel="stylesheet" href="./styles/sec4.css">
    <link rel="stylesheet" href="./styles/sec5.css">
    <link rel="stylesheet" href="./styles/sec6.css">
    <link rel="stylesheet" href="./styles/sec7.css">
    <link rel="stylesheet" href="./styles/footer.css">

</head>

<body>
    <div id="header"></div>
    <div id="sec1"></div>
    <div id="sec2"></div>

    <div id="sec5"></div>
    <div id="sec6"></div>
    <div id="sec7"></div>
    <div id="footer"></div>

    <script>
        fetch('./components/header.html').then(r => r.text()).then(d => document.getElementById('header').innerHTML = d);
        fetch('./components/sec1.html').then(r => r.text()).then(d => document.getElementById('sec1').innerHTML = d);
        fetch('./components/sec2.html').then(r => r.text()).then(d => document.getElementById('sec2').innerHTML = d);
        fetch('./components/sec3.html').then(r => r.text()).then(d => document.getElementById('sec3').innerHTML = d);
        fetch('./components/sec4.html').then(r => r.text()).then(d => document.getElementById('sec4').innerHTML = d);
        fetch('./components/sec5.html').then(r => r.text()).then(d => document.getElementById('sec5').innerHTML = d);
        fetch('./components/sec6.html').then(r => r.text()).then(d => document.getElementById('sec6').innerHTML = d);
        fetch('./components/sec7.html').then(r => r.text()).then(d => document.getElementById('sec7').innerHTML = d);
        fetch('./components/footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d);
    </script>
</body>
</html>
